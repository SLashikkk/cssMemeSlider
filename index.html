<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <link rel="icon" href="./assets/icon/favicon.ico" />
    <title>CSS Meme Slider</title>
  </head>
  <body>
    <div class="page__wrapper">
      <header class="header">
        <h1 class="title">CSS Meme Slider</h1>
      </header>
      <main class="main">
        <div class="slider__wrapper">
          <div class="slider__box">
            <img class="slide" src="./assets/img/1.jpg" alt="slide1" />
            <img class="slide" src="./assets/img/2.jpg" alt="slide2" />
            <img class="slide" src="./assets/img/3.jpg" alt="slide3" />
            <img class="slide" src="./assets/img/4.jpg" alt="slide4" />
            <img class="slide" src="./assets/img/5.jpg" alt="slide5" />
            <img class="slide" src="./assets/img/6.jpg" alt="slide6" />
          </div>
          <div class="slider__info-box">
            <div class="slider__info"></div>
            <div class="slider__controls"></div>
          </div>
        </div>
      </main>
      <footer class="footer">
        <a
          class="footer__link"
          href="https://github.com/SLashikkk/cssMemeSlider"
          >© Slashikkk</a
        >
      </footer>
    </div>
  </body>
</html>
