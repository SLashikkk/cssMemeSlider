<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <link rel="icon" href="./assets/icon/favicon.ico" />
    <title>CSS Meme Slider</title>
  </head>
  <body>
    <div class="page__wrapper">
      <header class="header">
        <h1 class="title">CSS Meme Slider</h1>
      </header>
      <main class="main">
        <div class="slider__wrapper">
          <input type="radio" name="slider" id="r1" checked />
          <input type="radio" name="slider" id="r2" />
          <input type="radio" name="slider" id="r3" />
          <input type="radio" name="slider" id="r4" />
          <input type="radio" name="slider" id="r5" />
          <input type="radio" name="slider" id="r6" />
          <div class="slider__box">
            <img class="slide" src="./assets/img/1.jpg" alt="slide1" />
            <img class="slide" src="./assets/img/2.jpg" alt="slide2" />
            <img class="slide" src="./assets/img/3.jpg" alt="slide3" />
            <img class="slide" src="./assets/img/4.jpg" alt="slide4" />
            <img class="slide" src="./assets/img/5.jpg" alt="slide5" />
            <img class="slide" src="./assets/img/6.jpg" alt="slide6" />
          </div>
          <div class="slider__info-box">
            <div class="slider__info">
              <p class="slide__text">Когда зашёл в класс в новых очках</p>
              <p class="slide__text">Пятница вечер! Рок-н-ролл, пацаны!</p>
              <p class="slide__text">Мой ор выше гор с твоих шуток</p>
              <p class="slide__text">Слушаю бред, который ты несёшь в баре</p>
              <p class="slide__text">
                Я смотрю на тебя, а ты на меня. Искра. Буря.
              </p>
              <p class="slide__text">
                Пришёл на собеседование на позицию Senior
              </p>
            </div>
            <div class="slider__controls-wrapper">
              <label for="r1" class="slider__control"
                ><span class="slider__control-dot"></span
              ></label>
              <label for="r2" class="slider__control"
                ><span class="slider__control-dot"></span
              ></label>
              <label for="r3" class="slider__control"
                ><span class="slider__control-dot"></span
              ></label>
              <label for="r4" class="slider__control"
                ><span class="slider__control-dot"></span
              ></label>
              <label for="r5" class="slider__control"
                ><span class="slider__control-dot"></span
              ></label>
              <label for="r6" class="slider__control"
                ><span class="slider__control-dot"></span
              ></label>
            </div>
          </div>
        </div>
      </main>
      <footer class="footer">
        <a
          class="footer__link"
          href="https://github.com/SLashikkk/cssMemeSlider"
          >© Slashikkk</a
        >
      </footer>
    </div>
  </body>
</html>
